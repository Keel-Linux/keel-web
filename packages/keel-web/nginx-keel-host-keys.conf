# keel-web: Nginx starts after the machine has its certificate (Keel-Linux/
# keel-web#4). The default site serves 443 with /etc/ssl/private/cert.pem
# and cert.key, so without them nginx -t refuses the whole configuration
# and port 80 goes down with 443. keel-host-keys.service of inithooks makes
# a missing pair (turnkey-make-ssl-cert --default) on every boot and is
# ordered before nginx.service already; this has Nginx pull it in as well,
# wherever Nginx is started from, and start after it.
#
# Not an ExecStartPre=: a drop-in's is appended after nginx.service's own
# `nginx -t`, which fails first, and replacing that list would copy
# Debian's line here. A Wants= of a unit that is not installed is no error.
# Installed as /usr/lib/systemd/system/nginx.service.d/keel-web.conf.

[Unit]
Wants=keel-host-keys.service
After=keel-host-keys.service
