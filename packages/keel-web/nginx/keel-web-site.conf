# keel-web: the content of Keel Web's default site, installed as
# /etc/nginx/snippets/keel-web-site.conf and included in a server: by each
# server of the default site of a simple installation
# (sites-available/keel-default) and, in the cloud modes, by the server
# behind Anubis on unix:/run/nginx/keel-app.sock
# (sites-available/default-anubis). One file, so that port 80, port 443 and
# the loopback serve the same content (handbook decision 0079).
#
# The pages are /var/www/keel-default: the placeholder until an
# application layer or the operator puts a site there, with their own 404
# and 50x pages, which are never served by name.

root /var/www/keel-default;
index index.html;

error_page 404 /404.html;
error_page 500 502 503 504 /50x.html;

# The routes of a stack or application layer (LNMP, LNPP: handbook
# decision 0059; WordPress, Laravel, Odoo), each a location block in a file
# of /etc/nginx/keel-default.d/.
include /etc/nginx/keel-default.d/*.conf;

location = /404.html {
	internal;
}

location = /50x.html {
	internal;
}

location / {
	try_files $uri $uri/ =404;
}
