# keel-web: the scheme the client used, for an application behind Anubis
# (Keel-Linux/handbook decision 0087, option B), installed as
# /etc/nginx/conf.d/keel-web-scheme.conf, in the http context.
#
# In the cloud modes the client speaks to the front of keel-web (port 443
# or 80). The front hands the request to Anubis, and Anubis to the server
# of the application on unix:/run/nginx/keel-app.sock, in plain HTTP. So
# $https is empty there, and an application that builds its own links
# makes http:// links on a request to port 443. The front sets
# X-Forwarded-Proto to its own $scheme (snippets/keel-anubis.conf), which
# replaces any value of the client, and only the front reaches the socket.
#
# $keel_web_https is "on" for a request on the app socket whose front was
# HTTPS, and $https everywhere else (the default site of a simple
# installation, the loopback). An application route uses it after
# fastcgi_params:
#
#     include fastcgi_params;
#     fastcgi_param HTTPS $keel_web_https if_not_empty;
#
# Port 80 keeps http:// links, as decision 0079 asks while the certificate
# is self-signed. Measured on an LNMP pair with Nextcloud 35 (the third
# test of 0087): 302 to https:// on 443, to http:// on 80, and a forged
# X-Forwarded-Proto of the client changed nothing.
map "$server_addr|$http_x_forwarded_proto" $keel_web_https {
	"unix:/run/nginx/keel-app.sock|https" on;
	default $https;
}
