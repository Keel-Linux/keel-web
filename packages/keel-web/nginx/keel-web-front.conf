# keel-web: what a server of the Anubis front serves, installed as
# /etc/nginx/snippets/keel-web-front.conf and included in each server of
# sites-available/default-anubis that takes requests: port 80, port 443
# and the loopback addresses of port 80 (handbook decisions 0030, 0041 and
# 0079). Every request goes through /etc/nginx/snippets/keel-anubis.conf of
# keel-overlay-anubis. What Anubis allows comes back on
# unix:/run/nginx/keel-app.sock, where keel-web-site.conf serves it.

# The body limit of the front is the default of Nginx, 1 MB, and it is
# the only bound before Anubis, because the front hands the request body
# to Anubis whole. An application that takes uploads sets a larger limit
# with one client_max_body_size in a file of /etc/nginx/keel-front.d/, as
# the application layer of WordPress does (Keel-Linux/keel-web#15). This
# file sets none itself: Nginx refuses a second client_max_body_size in the
# same server. Coraza (keel-overlay-coraza 0.1.4) reads no upload file as
# an argument, so the size of an upload does not change the memory of a
# worker.
include /etc/nginx/keel-front.d/*.conf;

# Nginx answers here itself when Anubis is down or slow (502, 504): the
# default site's pages, not nginx's stock page.
root /var/www/keel-default;
error_page 404 /404.html;
error_page 500 502 503 504 /50x.html;

location = /404.html {
	internal;
}

location = /50x.html {
	internal;
}

location / {
	include /etc/nginx/snippets/keel-anubis.conf;
}

# Static files go to the browser without the Anubis challenge, but only
# when Nginx serves them as files from the disk (the maintainer's decision
# of 2026-11-07). Anubis answers a request without its cookie with the
# challenge page, an HTML page with status 200, also for a stylesheet: the
# login page of a WordPress replica of a cloud advanced pair was shot
# with no style (BR2, 2026-11-07). Thus:
#
#   - only a path that ends in one extension of the list below. A .php
#     path never matches, and no other dynamic path does: the path that
#     Nginx examines has no query string;
#   - only a file that is on the disk under the root, by try_files. A
#     path of the list that is not a file (an application route, or
#     /index.php/a.css) goes to Anubis, through @keel-anubis;
#   - no path with a hidden file or directory in it: it goes to Anubis,
#     and the site's own refusal (for example .git) stays in force.
#
# The root is that of the default site, /var/www/keel-default, unless a
# file of /etc/nginx/keel-static.d/ sets it: the application layer of the
# image puts its document root there (for example "root
# /var/www/wordpress;"). Only one file of that directory may set a root:
# Nginx refuses a second root in the same location.
location ~* ^(?!.*/\.)[^?]*\.(?:css|js|mjs|map|png|jpe?g|gif|webp|avif|svg|ico|bmp|woff2?|ttf|otf|eot)$ {
	include /etc/nginx/keel-static.d/*.conf;
	add_header X-Content-Type-Options nosniff always;
	try_files $uri @keel-anubis;
}

location @keel-anubis {
	include /etc/nginx/snippets/keel-anubis.conf;
}
