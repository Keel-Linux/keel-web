# keel-web: port 80 redirects to HTTPS (handbook decision 0079). Linked as
# /etc/nginx/keel-web/http-redirect.conf by /usr/lib/keel-web/http-mode
# while the machine's certificate is one that a certificate authority
# issued, and removed while it is self-signed; never by hand. The public
# server on port 80 of each default site includes it at server level, so
# it applies before any route of /etc/nginx/keel-default.d/.
#
# ACME's http-01 challenges stay on port 80: a certificate authority asks
# for them over HTTP, also to renew a certificate.
if ($uri !~ "^/\.well-known/acme-challenge/") {
	return 301 https://$host$request_uri;
}
