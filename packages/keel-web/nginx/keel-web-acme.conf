# keel-web: ACME's http-01 challenges on port 80 (handbook decision 0079),
# installed as /etc/nginx/snippets/keel-web-acme.conf and included in the
# public server on port 80 of each default site. The directory is the
# WELLKNOWN of confconsole's dehydrated configuration. confconsole's
# dehydrated-wrapper stops Nginx while it gets a certificate, so this is
# for a client that keeps Nginx running. Nothing else is served from there.
location ^~ /.well-known/acme-challenge/ {
	alias /var/lib/dehydrated/acme-challenges/;
	# A missing challenge is a 404. The site's error page would be an
	# internal redirect to /404.html, which runs the server-level redirect
	# of http-redirect.conf again and answers 301; a named location does
	# not run it.
	error_page 404 @keel_web_no_challenge;
}

location @keel_web_no_challenge {
	return 404;
}
