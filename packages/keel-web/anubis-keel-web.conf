# keel-web: anubis@keel.service reads /etc/anubis/keel-web-http.env after
# its own /etc/anubis/keel.env, so the values there win (handbook decision
# 0079). /usr/lib/keel-web/http-mode links it while the machine's
# certificate is self-signed, when port 80 serves the site through Anubis
# and Anubis must set its cookies without Secure; the "-" makes a missing
# file no error. Anubis starts after keel-web-http.service has decided.
# Installed as /usr/lib/systemd/system/anubis@keel.service.d/keel-web.conf.

[Unit]
After=keel-web-http.service

[Service]
EnvironmentFile=-/etc/anubis/keel-web-http.env
