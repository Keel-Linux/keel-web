# keel-web: anubis@keel.service redirects a solved challenge only to the
# machine's own names and addresses. Without REDIRECT_DOMAINS Anubis
# redirects to any host (an open redirect), so before each start
# keel-web-anubis-domains.service writes it to a runtime environment file,
# read after keel.env; when it cannot, the unit does not start. systemd
# reads an EnvironmentFile before ExecStartPre runs, hence a unit of its
# own, as the signing key has. A name or an address changed later needs a
# restart of anubis@keel.
[Unit]
Requires=keel-web-anubis-domains.service
After=keel-web-anubis-domains.service

[Service]
EnvironmentFile=/run/keel-web/anubis.env
